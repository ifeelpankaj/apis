services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: cab_app
      POSTGRES_PASSWORD: cab_dev_password
      POSTGRES_DB: cab_management
    command: >
      postgres
      -c idle_in_transaction_session_timeout=30s
      -c statement_timeout=30s
      -c lock_timeout=10s
      -c log_min_duration_statement=200
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cab_app -d cab_management']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
